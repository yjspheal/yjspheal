name: Profile 3d grass and snake   # 워크플로 이름

on:
  schedule:
    - cron: "0 15 * * *"           # (UTC) 매일 1회, 한국시간 자정
  workflow_dispatch:                # 수동 실행

permissions:
  contents: write                   # output 브랜치 푸시 권한

jobs:
  build:
    runs-on: ubuntu-latest          # 최신 Ubuntu 러너

    steps:
      # 0) 저장소 체크아웃
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1) dist 폴더 준비
      - name: Prepare dist folder
        run: mkdir -p dist

      # 2) 입체 잔디 생성
      - name: Generate 3d grass
        uses: lowlighter/metrics@latest
        with:
          user: yjspheal
          token: ${{ secrets.METRICS_TOKEN }}    # PAT 필요(레포/스코프 주의)
          template: classic
          filename: dist/metrics-6m.svg                 # metrics 액션이 master에 직접 커밋함
          base: ""
          config_timezone: Asia/Seoul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # 3) 뱀 생성
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: yjspheal
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 4) 상태 확인(옵션)
      - name: Git status
        run: git status

      # 5) 산출물 목록(옵션)
      - name: List dist
        run: ls -alh dist || true

      # 6) output 브랜치로 배포
      - name: Deploy profile assets to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
